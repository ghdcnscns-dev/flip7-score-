<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플립 7 (Flip 7) 실시간 점수판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes fadeOutUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        .animate-score { animation: fadeOutUp 1.5s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <h1 class="text-3xl font-black text-center mb-6 text-amber-400">🎲 FLIP 7 실시간 점수판</h1>

        <!-- 1. 로비 화면 -->
        <div id="lobby-section" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">닉네임</label>
                <input type="text" id="player-name" placeholder="본인 닉네임 입력" class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400">
            </div>
            
            <div class="pt-2 border-t border-slate-700 space-y-3">
                <button onclick="createRoom()" class="w-full bg-amber-500 hover:bg-amber-600 font-bold py-3 rounded-lg text-slate-950 transition cursor-pointer">
                    방 만들기 (참가코드 생성)
                </button>
                
                <div class="flex gap-2">
                    <input type="text" id="room-code-input" placeholder="참가코드 4자리" class="w-1/2 px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 uppercase focus:outline-none focus:border-amber-400 text-center font-bold tracking-widest">
                    <button onclick="joinRoom()" class="w-1/2 bg-blue-600 hover:bg-blue-700 font-bold py-2 rounded-lg transition cursor-pointer">
                        참여하기
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. 게임 화면 -->
        <div id="game-section" class="hidden space-y-6">
            <div class="flex justify-between items-center bg-slate-700/50 p-3 rounded-lg border border-slate-700">
                <div>
                    <span class="text-xs text-slate-400 block">참가 코드</span>
                    <span id="display-room-code" class="text-xl font-mono font-bold text-amber-400 tracking-wider">----</span>
                </div>
                <div class="text-right relative">
                    <span class="text-xs text-slate-400 block">내 총 점수</span>
                    <span id="last-added-score" class="absolute -top-6 right-0 font-bold text-lg opacity-0"></span>
                    <span id="my-score" class="text-2xl font-black text-emerald-400">0점</span>
                </div>
            </div>

            <div class="bg-slate-700/30 p-4 rounded-xl border border-slate-700 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-semibold text-slate-300">내 카드 점수 입력</h2>
                    <button onclick="toggleCalculator()" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg font-bold transition cursor-pointer">
                        🧮 계산기 열기/닫기
                    </button>
                </div>

                <!-- 점수 입력 및 더하기/빼기 버튼 -->
                <div class="flex gap-2">
                    <input type="number" id="card-score-input" placeholder="점수 입력" class="w-full px-4 py-2 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-amber-400 text-lg font-bold">
                    <button onclick="modifyScore(true)" class="bg-emerald-600 hover:bg-emerald-700 font-bold px-4 py-2 rounded-lg transition cursor-pointer whitespace-nowrap">더하기</button>
                    <button onclick="modifyScore(false)" class="bg-rose-600 hover:bg-rose-700 font-bold px-4 py-2 rounded-lg transition cursor-pointer whitespace-nowrap">빼기</button>
                </div>

                <!-- 미니 계산기 패널 (처음엔 안 보이도록 display 제어 추가) -->
                <div id="calculator-panel" style="display: none;" class="bg-slate-900/90 p-3 rounded-lg border border-slate-600 space-y-2">
                    <div class="grid grid-cols-3 gap-1.5">
                        <button onclick="appendNum(1)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">1</button>
                        <button onclick="appendNum(2)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">2</button>
                        <button onclick="appendNum(3)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">3</button>
                        <button onclick="appendNum(4)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">4</button>
                        <button onclick="appendNum(5)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">5</button>
                        <button onclick="appendNum(6)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">6</button>
                        <button onclick="appendNum(7)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">7</button>
                        <button onclick="appendNum(8)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">8</button>
                        <button onclick="appendNum(9)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">9</button>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button onclick="appendNum(0)" class="bg-slate-700 hover:bg-slate-600 py-2.5 rounded font-bold text-lg transition cursor-pointer">0</button>
                        <button onclick="clearCalcInput()" class="bg-rose-900/80 hover:bg-rose-800 py-2.5 rounded font-bold text-sm text-rose-200 transition cursor-pointer">지우기</button>
                    </div>
                </div>

                <div class="flex gap-2 pt-1">
                    <button onclick="resetMyScore()" class="w-1/2 bg-rose-600/80 hover:bg-rose-700 font-medium py-2 rounded-lg text-sm transition cursor-pointer">내 점수 초기화</button>
                    <button onclick="leaveRoom()" class="w-1/2 bg-slate-600 hover:bg-slate-500 font-medium py-2 rounded-lg text-sm transition cursor-pointer">나가기</button>
                </div>
            </div>

            <!-- 순위 보드 -->
            <div>
                <h2 class="text-sm font-semibold text-slate-300 mb-2 flex items-center justify-between">
                    <span>🏆 실시간 순위 보드</span>
                </h2>
                <div id="leaderboard" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
            </div>

            <!-- 득점 로그 -->
            <div>
                <h2 class="text-sm font-semibold text-slate-300 mb-2">📜 최근 점수 로그</h2>
                <div id="score-log-list" class="space-y-1 max-h-32 overflow-y-auto pr-1 text-xs text-slate-400 bg-slate-900/50 p-2 rounded-lg border border-slate-800">
                    <p>게임이 시작되었습니다.</p>
                </div>
            </div>
        </div>

        <div class="mt-8 pt-4 border-t border-slate-700 text-center">
            <p class="text-xs text-slate-500">Made by 천상민</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ebgziywanxwxqohxhvam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViZ3ppeXdhbnh3eHFvaHhodmFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc2MjQsImV4cCI6MjEwMjA0MzYyNH0.FUGQjkx6Hv801UeeE_Ti7XXlVPRiG1bOIuHTEJXDRBA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentRoomCode = null;
        let myPlayerId = null;
        let myCurrentScore = 0;

        // 계산기 열고 닫기 (style.display 활용으로 확실하게 제어)
        function toggleCalculator() {
            const panel = document.getElementById('calculator-panel');
            if (panel.style.display === 'none' || panel.style.display === '') {
                panel.style.display = 'block';
            } else {
                panel.style.display = 'none';
            }
        }

        // 계산기 숫자 입력 기능
        function appendNum(num) {
            const inputEl = document.getElementById('card-score-input');
            const currentVal = inputEl.value;
            if (!currentVal || currentVal === '0') {
                inputEl.value = num;
            } else {
                inputEl.value = currentVal + num;
            }
        }

        // 계산기 입력 지우기 기능
        function clearCalcInput() {
            document.getElementById('card-score-input').value = '';
        }

        function showScoreAnimation(val, isAdd) {
            const el = document.getElementById('last-added-score');
            el.innerText = (isAdd ? `+${val}` : `-${val}`);
            el.className = `absolute -top-6 right-0 font-bold text-lg opacity-0 ${isAdd ? 'text-emerald-400' : 'text-rose-400'}`;
            el.classList.remove('animate-score');
            void el.offsetWidth;
            el.classList.add('animate-score');
        }

        async function modifyScore(isAdd) {
            const inputEl = document.getElementById('card-score-input');
            let inputVal = parseInt(inputEl.value);
            if (isNaN(inputVal)) { alert('점수를 입력해주세요!'); return; }
            
            if (inputVal < 0) inputVal = Math.abs(inputVal);

            if (isAdd) {
                myCurrentScore += inputVal;
            } else {
                myCurrentScore -= inputVal;
            }

            document.getElementById('my-score').innerText = myCurrentScore + '점';
            showScoreAnimation(inputVal, isAdd);
            inputEl.value = '';
            
            await supabaseClient.from('players').update({ score: myCurrentScore }).eq('id', myPlayerId);

            const myName = document.getElementById('player-name').value;
            supabaseClient.channel('room-channel-' + currentRoomCode).send({
                type: 'broadcast',
                event: 'score_log',
                payload: { name: myName, score: inputVal, isAdd: isAdd, type: 'modify' }
            });
        }

        function generateRoomCode() { return Math.random().toString(36).substring(2, 6).toUpperCase(); }
        
        async function createRoom() {
            const name = document.getElementById('player-name').value.trim();
            if (!name) { alert('닉네임을 입력해주세요!'); return; }
            const code = generateRoomCode();
            await supabaseClient.from('rooms').insert([{ code }]);
            const { data } = await supabaseClient.from('players').insert([{ room_code: code, name: name, score: 0 }]).select();
            currentRoomCode = code; myPlayerId = data[0].id; myCurrentScore = 0; enterGameUI();
        }

        async function joinRoom() {
            const name = document.getElementById('player-name').value.trim();
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!name || !code) { alert('닉네임과 코드를 확인해주세요!'); return; }
            const { data: roomData } = await supabaseClient.from('rooms').select('code').eq('code', code).single();
            if (!roomData) { alert('존재하지 않는 방입니다.'); return; }
            const { data } = await supabaseClient.from('players').insert([{ room_code: code, name: name, score: 0 }]).select();
            currentRoomCode = code; myPlayerId = data[0].id; myCurrentScore = 0; enterGameUI();
        }

        function enterGameUI() {
            document.getElementById('lobby-section').classList.add('hidden');
            document.getElementById('game-section').classList.remove('hidden');
            document.getElementById('display-room-code').innerText = currentRoomCode;
            fetchLeaderboard(); subscribeRealtime();
        }

        async function resetMyScore() {
            const previousScore = myCurrentScore;

            myCurrentScore = 0; 
            document.getElementById('my-score').innerText = '0점';
            await supabaseClient.from('players').update({ score: 0 }).eq('id', myPlayerId);

            const myName = document.getElementById('player-name').value;
            supabaseClient.channel('room-channel-' + currentRoomCode).send({
                type: 'broadcast',
                event: 'score_log',
                payload: { name: myName, type: 'reset', prevScore: previousScore }
            });
        }

        async function fetchLeaderboard() {
            const { data } = await supabaseClient.from('players').select('*').eq('room_code', currentRoomCode).order('score', { ascending: false });
            if (data) renderLeaderboard(data);
        }

        function renderLeaderboard(players) {
            const container = document.getElementById('leaderboard'); container.innerHTML = '';
            players.forEach((player, index) => {
                const isMe = player.id === myPlayerId;
                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-3 rounded-lg border ${isMe ? 'bg-amber-500/10 border-amber-500/40' : 'bg-slate-700/40 border-slate-700'}`;
                item.innerHTML = `<div class="flex items-center gap-3"><span class="w-6 text-center text-lg ${index === 0 ? 'text-amber-400 font-bold' : 'text-slate-400'}">${index + 1}등</span><span class="font-medium text-slate-200">${player.name} ${isMe ? '(나)' : ''}</span></div><span class="font-bold text-lg text-emerald-400">${player.score}점</span>`;
                container.appendChild(item);
            });
        }

        function subscribeRealtime() {
            const channel = supabaseClient.channel('room-channel-' + currentRoomCode);
            channel
                .on('postgres_changes', { event: '*', schema: 'public', table: 'players', filter: `room_code=eq.${currentRoomCode}` }, () => fetchLeaderboard())
                .on('broadcast', { event: 'score_log' }, (payload) => {
                    const logList = document.getElementById('score-log-list');
                    const newLog = document.createElement('p');
                    
                    if (payload.payload.type === 'reset') {
                        newLog.innerHTML = `● ${payload.payload.name}님: <span class="text-amber-400">누적 점수 ${payload.payload.prevScore}점에서 초기화되었습니다.</span>`;
                    } else {
                        const sign = payload.payload.isAdd ? '+' : '-';
                        const colorClass = payload.payload.isAdd ? 'text-emerald-400' : 'text-rose-400';
                        newLog.innerHTML = `● ${payload.payload.name}님: <span class="${colorClass}">${sign}${payload.payload.score}점</span>`;
                    }
                    
                    logList.prepend(newLog);
                    if (logList.children.length > 15) logList.lastElementChild.remove();
                })
                .subscribe();
        }

        async function leaveRoom() {
            if (myPlayerId) await supabaseClient.from('players').delete().eq('id', myPlayerId);
            location.reload();
        }
    </script>
</body>
</html>
